<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Stateline Campground logo">
  <circle cx="128" cy="128" r="122" fill="#F4F0E6" stroke="#1F3D2B" stroke-width="8"/>
  <circle cx="128" cy="128" r="110" fill="none" stroke="#1F3D2B" stroke-width="2" opacity="0.35"/>

  <!-- campfire emblem (flame + crossed logs), sized to sit in the upper half -->
  <g transform="translate(128 102) scale(0.8) translate(-128 -108)">
    <!-- flame -->
    <path d="M128 44
      c 15 18 5 32 11 45
      c 5 -5 7 -15 7 -15
      c 12 14 18 27 18 42
      c 0 21 -16 37 -36 37
      c -20 0 -37 -16 -37 -36
      c 0 -17 10 -30 21 -40
      c -1 8 2 16 7 21
      c -7 -19 -5 -35 9 -52 z" fill="#1F3D2B"/>
    <path d="M124 92
      c 8 -9 6 -20 1 -29
      c 10 8 16 19 16 31
      c 0 11 -8 20 -18 20
      c -8 0 -15 -7 -15 -16
      c 0 -6 3 -11 7 -15
      c -1 10 3 17 10 18
      c 5 1 5 -4 -1 -10 z" fill="#F4F0E6"/>

    <!-- crossed logs with cut ends -->
    <rect x="84" y="138" width="88" height="16" rx="8" transform="rotate(27 128 146)" fill="#1F3D2B"/>
    <rect x="84" y="138" width="88" height="16" rx="8" transform="rotate(-27 128 146)" fill="#1F3D2B"/>
    <ellipse cx="89" cy="160" rx="7.5" ry="6" transform="rotate(27 89 160)" fill="#F4F0E6"/>
    <ellipse cx="167" cy="160" rx="7.5" ry="6" transform="rotate(-27 167 160)" fill="#F4F0E6"/>
  </g>

  <!-- wordmark, clear of the emblem above -->
  <g fill="#1F3D2B" text-anchor="middle">
    <text x="128" y="188" font-family="'Zilla Slab', Georgia, serif" font-weight="700" font-size="30" letter-spacing="0.5">STATELINE</text>
    <text x="128" y="207" font-family="'Montserrat','DejaVu Sans',sans-serif" font-weight="600" font-size="13" letter-spacing="4">CAMPGROUND</text>
    <rect x="64" y="203.2" width="13" height="2.3" rx="1.1"/>
    <rect x="179" y="203.2" width="13" height="2.3" rx="1.1"/>
  </g>

  <!-- small treeline + lake at the base -->
  <g fill="#1F3D2B">
    <path d="M98 226 l6-13 6 13z M109 226 l7-15 7 15z M121 226 l7-17 7 17z M133 226 l7-15 7 15z M146 226 l6-13 6 13z"/>
    <rect x="110" y="230" width="36" height="2.4" rx="1.2"/>
  </g>
</svg>
